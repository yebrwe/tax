<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>종합소득세 서류 관리</title>
    <link rel="icon" href="data:," />
    <script>
      (() => {
        try {
          const role = new URLSearchParams(window.location.search).get("role");
          if (role === "family" || role === "accountant") {
            document.documentElement.dataset.bootScreen = "app";
          }
        } catch {
          // Keep the static entry screen if URL parsing is unavailable.
        }
      })();
    </script>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-screen="entry">
    <section class="entry-screen" id="entryScreen" aria-label="역할 선택">
      <div class="entry-inner">
        <p class="eyebrow" id="entryEyebrow">신고 준비</p>
        <h1 id="entryTitle">종합소득세 서류 관리</h1>
        <div class="entry-options">
          <article class="entry-card entry-card-button" id="startAccountantButton" role="button" tabindex="0" aria-label="세무사 요청서류 설정하기">
            <span class="entry-badge">세무사</span>
            <h2>요청서류 설정</h2>
            <p>필요한 서류를 선택하고 개인·법인 대상자에게 업로드 링크를 공유합니다.</p>
            <span class="primary-button entry-action" aria-hidden="true">요청서류 설정하기</span>
          </article>
          <article class="entry-card entry-card-clickable" id="familyEntryCard">
            <span class="entry-badge">일반 사용자</span>
            <h2>파일 업로드</h2>
            <p>세무사가 보내준 업로드 링크로 들어오면 요청서류만 보고 파일을 올립니다.</p>
            <div class="entry-link-form">
              <label class="sr-only" for="familyLinkInput">업로드 링크 또는 작업방 코드</label>
              <input id="familyLinkInput" type="text" placeholder="업로드 링크 또는 작업방 코드" />
              <button class="primary-button entry-action" id="openFamilyLinkButton" type="button">파일 올리러 가기</button>
            </div>
          </article>
        </div>
      </div>
    </section>

    <header class="app-header">
      <div>
        <p class="eyebrow" id="appEyebrow">신고 준비</p>
        <h1 id="appTitle">종합소득세 서류 관리</h1>
      </div>
      <div class="header-actions" aria-label="데이터 작업">
        <button class="icon-button header-action-button" id="copySummaryButton" type="button" title="진행상황 복사" aria-label="진행상황 복사">
          <span class="action-icon" aria-hidden="true">⧉</span>
          <span class="action-label">진행상황 복사</span>
        </button>
        <button class="icon-button header-action-button primary-action" id="downloadZipButton" type="button" title="전체 파일 받기" aria-label="전체 파일 받기">
          <span class="action-icon" aria-hidden="true">ZIP</span>
          <span class="action-label">전체 파일 받기</span>
        </button>
        <button class="icon-button header-action-button" id="printButton" type="button" title="인쇄하기" aria-label="인쇄하기">
          <span class="action-icon" aria-hidden="true">⎙</span>
          <span class="action-label">인쇄하기</span>
        </button>
      </div>
    </header>

    <main>
      <section class="overview" aria-label="전체 현황">
        <article class="metric">
          <span class="metric-label">완료</span>
          <strong id="doneMetric">0</strong>
        </article>
        <article class="metric">
          <span class="metric-label">요청</span>
          <strong id="activeMetric">0</strong>
        </article>
        <article class="metric">
          <span class="metric-label">미완료</span>
          <strong id="todoMetric">0</strong>
        </article>
        <article class="metric highlight">
          <span class="metric-label">전체 진행률</span>
          <strong id="progressMetric">0%</strong>
        </article>
      </section>

      <section class="people-strip" id="peopleStrip" aria-label="대상자 현황"></section>

      <section class="workspace">
        <aside class="controls" aria-label="필터">
          <div class="mode-tabs" role="tablist" aria-label="업무 모드">
            <button class="mode-tab is-active" id="requestedModeButton" type="button">요청서류</button>
            <button class="mode-tab" id="catalogModeButton" type="button">서류 선택</button>
          </div>

          <div class="control-block person-control">
            <label for="personFilter">대상자</label>
            <select id="personFilter"></select>
          </div>

          <div class="control-block search-control">
            <label for="searchInput">서류 검색</label>
            <input id="searchInput" type="search" placeholder="예: 지방세, 종부세, 의료비, 대출" />
          </div>

          <div class="quick-actions">
            <button class="wide-button neutral" id="openTargetManagerButton" type="button">
              <span aria-hidden="true">＋</span>
              대상자 추가
            </button>
            <button class="wide-button share-action" id="copyFamilyLinkButton" type="button">
              <span aria-hidden="true">⧉</span>
              업로드 링크 복사
            </button>
            <button class="wide-button" id="addTaskButton" type="button">
              <span aria-hidden="true">＋</span>
              직접 추가
            </button>
          </div>

          <div class="catalog-actions" id="catalogActions" hidden>
            <button class="wide-button" id="requestVisibleButton" type="button">
              <span aria-hidden="true">✓</span>
              현재 목록 요청
            </button>
            <button class="wide-button neutral" id="unrequestVisibleButton" type="button">
              <span aria-hidden="true">−</span>
              현재 목록 해제
            </button>
          </div>

          <details class="filter-drawer">
            <summary>필터 / 신고 설정</summary>
            <div class="filter-drawer-body">
              <details class="case-settings" id="caseSettings">
                <summary>신고 설정</summary>
                <div class="case-settings-body">
                  <label class="wide">
                    제목
                    <input id="caseTitleInput" type="text" />
                  </label>
                  <label>
                    귀속연도
                    <input id="taxYearInput" type="number" inputmode="numeric" min="2000" max="2100" />
                  </label>
                  <label>
                    신고연도
                    <input id="filingYearInput" type="number" inputmode="numeric" min="2000" max="2100" />
                  </label>
                  <label>
                    신고월
                    <input id="filingMonthInput" type="number" inputmode="numeric" min="1" max="12" />
                  </label>
                  <div class="case-actions wide">
                    <button class="wide-button neutral" id="newCaseButton" type="button">
                      <span aria-hidden="true">＋</span>
                      새 신고건 시작
                    </button>
                  </div>
                  <section class="target-manager wide" aria-label="대상자 관리">
                    <div class="target-manager-head">
                      <strong>대상자 관리</strong>
                      <span id="targetCountText">0곳</span>
                    </div>
                    <div class="target-add-row">
                      <label class="sr-only" for="targetNameInput">대상자명</label>
                      <input id="targetNameInput" type="text" placeholder="이름 또는 법인명" />
                      <label class="sr-only" for="targetTypeSelect">대상 구분</label>
                      <select id="targetTypeSelect" aria-label="대상 구분">
                        <option value="individual">개인</option>
                        <option value="corporate">법인</option>
                        <option value="other">기타</option>
                      </select>
                      <button class="wide-button" id="addTargetButton" type="button">추가</button>
                    </div>
                    <div class="target-list" id="targetList"></div>
                  </section>
                </div>
              </details>

              <div class="control-block status-control">
                <label for="statusFilter">상태</label>
                <select id="statusFilter">
                  <option value="all">전체</option>
                  <option value="todo">미완료</option>
                  <option value="done">완료</option>
                </select>
              </div>

              <div class="control-block category-control">
                <label for="categoryFilter">카테고리</label>
                <select id="categoryFilter"></select>
              </div>

              <div class="control-block sort-control">
                <label for="sortSelect">정렬</label>
                <select id="sortSelect">
                  <option value="popular">자주 쓰는 순</option>
                  <option value="person">대상자순</option>
                  <option value="category">카테고리순</option>
                  <option value="status">상태순</option>
                  <option value="title">서류명순</option>
                </select>
              </div>

              <button class="wide-button danger" id="resetButton" type="button">
                <span aria-hidden="true">↺</span>
                기본 목록으로 복원
              </button>
            </div>
          </details>
        </aside>

        <section class="family-progress-card" id="familyProgressCard" aria-label="업로드 현황">
          <div>
            <span id="familyProgressPerson">선택된 대상자</span>
            <strong id="familyProgressText">0/0 처리</strong>
          </div>
          <button class="primary-button" id="finishUploadButton" type="button">다 올렸어요</button>
        </section>

        <section class="task-panel" aria-label="서류 항목">
          <div class="panel-toolbar">
            <h2 id="taskCountTitle">서류 0건</h2>
            <div class="view-tabs" role="tablist" aria-label="보기 방식">
              <button class="tab is-active" id="compactViewButton" type="button">목록</button>
              <button class="tab" id="detailViewButton" type="button">상세</button>
            </div>
          </div>
          <div class="task-list" id="taskList"></div>
          <p class="empty-state" id="emptyState" hidden>조건에 맞는 서류가 없습니다.</p>
        </section>
      </section>
    </main>

    <dialog id="taskDialog">
      <form method="dialog" id="taskForm" novalidate>
        <div class="dialog-header">
          <h2 id="dialogTitle">항목 추가</h2>
          <button class="icon-button" value="cancel" type="submit" formnovalidate title="닫기" aria-label="닫기">
            <span aria-hidden="true">×</span>
          </button>
        </div>

        <input id="editingTaskId" type="hidden" />

        <div class="form-grid">
          <label>
            요청 대상
            <select id="taskPerson" required></select>
          </label>
          <label>
            카테고리
            <select id="taskCategory" required></select>
          </label>
          <label class="wide">
            서류명
            <input id="taskTitle" type="text" required placeholder="예: 임대차계약서 사본" />
          </label>
          <label>
            발급처
            <input id="taskIssuer" type="text" placeholder="예: 은행, 홈택스, 구청" />
          </label>
          <label class="wide">
            요청 메모
            <textarea id="taskDetail" rows="3" placeholder="필요한 범위나 주의사항만 입력"></textarea>
          </label>
          <label class="wide">
            내부 메모
            <textarea id="taskNote" rows="3" placeholder="세무사가 볼 참고사항"></textarea>
          </label>
        </div>

        <div class="dialog-actions">
          <button class="text-button danger" id="deleteTaskButton" type="button">삭제</button>
          <div>
            <button class="text-button" value="cancel" type="submit" formnovalidate>취소</button>
            <button class="primary-button" id="saveTaskButton" type="submit" value="default">저장</button>
          </div>
        </div>
      </form>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="./app.js"></script>
  </body>
</html>
